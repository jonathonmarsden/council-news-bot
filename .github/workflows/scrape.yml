name: Council News Bot

on:
  schedule:
    # TEMPORARY: Run every 5 mins 24/7 to clear backlog
    # Once backlog is cleared, revert to 15-min business hours only
    - cron: '*/5 * * * *'  # Every 5 minutes, 24/7
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - scrape-only
          - post-only

env:
  TZ: Australia/Melbourne

permissions:
  contents: write

# Prevent concurrent runs to avoid duplicate posts
concurrency:
  group: council-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Melbourne time
        id: check-time
        run: |
          # Get current Melbourne hour
          MELBOURNE_HOUR=$(TZ=Australia/Melbourne date +%H)
          echo "Melbourne hour: $MELBOURNE_HOUR"
          
          # Business hours: 5am (05) to 10pm (22)
          if [ "$MELBOURNE_HOUR" -ge 5 ] && [ "$MELBOURNE_HOUR" -lt 22 ]; then
            echo "within_hours=true" >> $GITHUB_OUTPUT
          else
            echo "within_hours=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          WITHIN_HOURS="${{ steps.check-time.outputs.within_hours }}"
          
          echo "Mode: $MODE"
          echo "Within Melbourne business hours: $WITHIN_HOURS"
          
          if [ "$MODE" = "scrape-only" ]; then
            echo "Running scrape only (dry-run)..."
            python main.py --dry-run
          elif [ "$MODE" = "post-only" ]; then
            echo "Running post only..."
            python main.py --limit 1
          elif [ "$WITHIN_HOURS" = "false" ]; then
            # TEMPORARY: Post overnight to clear backlog, but don't scrape
            echo "Outside business hours - posting only (no scrape)..."
            python main.py --post-only --limit 1
          else
            echo "Running scrape and post..."
            python main.py --limit 1
          fi
      
      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/posted_articles.json
          git diff --staged --quiet || git commit -m "chore: update posted articles [skip ci]"
          git push
      
      - name: Ping health check
        if: always()
        run: |
          # Ping healthchecks.io to confirm workflow ran
          # Will alert if no ping received within grace period
          if [ -n "${{ secrets.HEALTHCHECK_URL }}" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              curl -fsS --retry 3 "${{ secrets.HEALTHCHECK_URL }}" > /dev/null
            else
              curl -fsS --retry 3 "${{ secrets.HEALTHCHECK_URL }}/fail" > /dev/null
            fi
          fi

name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Test & Lint"]
    branches: [ master ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        id: sync
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'venv' \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.DS_Store' \
            --exclude 'data' \
            --exclude '*.db' \
            --exclude 'scripts/deployment/deploy_secrets.py' \
            --exclude '.ops.lock' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/council-news-bot"

      - name: Install logrotate config
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "install -m 0644 /opt/council-news-bot/scripts/deployment/logrotate-council-news-bot.conf /etc/logrotate.d/council-news-bot"

      - name: Rebuild and restart
        id: restart
        run: |
          # Build OUTSIDE the ops lock (slow, non-disruptive: old stack keeps
          # serving), then swap containers INSIDE an exclusive lock so we never
          # yank Postgres out from under a running cron scrape/queue job
          # (cron jobs hold the lock shared; see generate_crontab.py).
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/council-news-bot && docker compose build && flock -x -w 600 .ops.lock docker compose up -d --remove-orphans"
          echo "Deployed at $(date)"

      - name: Run database migrations
        id: migrate
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/council-news-bot && docker compose run --rm bot alembic upgrade head"

      - name: Record deployed commit
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/council-news-bot && echo '${{ github.sha }}' > .deploy_commit && date -u +%Y-%m-%dT%H:%M:%SZ > .deploy_timestamp"

      - name: Post-deploy health check
        id: health
        run: |
          # A real gate: services up, DB answering, migrations current, code
          # imports. (health_check.py always exited 0 and wrote its report
          # into the ephemeral container — it gated nothing.)
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/council-news-bot && docker compose ps && docker compose exec -T db psql -U councilbot -d council_news -c 'SELECT 1' && docker compose exec -T bot python3 -c 'import main, core.database, core.scrapers.factory; print(\"imports OK\")'"

      - name: Send deployment notification
        if: always()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993
            EMOJI="🚀"
            TITLE="Deploy Successful"
            DESC="Successfully deployed commit [\`$COMMIT_SHA\`](https://github.com/${{ github.repository }}/commit/$COMMIT_SHA) to production.\n\n**Message:** $COMMIT_MSG"
          else
            COLOR=15158332
            EMOJI="❌"
            TITLE="Deploy Failed"
            DESC="Failed to deploy commit [\`$COMMIT_SHA\`](https://github.com/${{ github.repository }}/commit/$COMMIT_SHA) to production.\n\n**Message:** $COMMIT_MSG\n\n⚠️ **Action Required:** Check [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and consider rollback."
          fi
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"$EMOJI $TITLE\", \"description\": \"$DESC\", \"color\": $COLOR, \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}], \"username\": \"CI/CD Bot\"}" \
            "${{ secrets.DISCORD_WEBHOOK_ALERTS }}" || echo "Failed to send Discord alert"

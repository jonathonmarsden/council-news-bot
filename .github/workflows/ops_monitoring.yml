name: Ops Monitoring

# Production runs on Rakali CT 104 (homelab), which GitHub runners cannot
# reach. Deploys are pull-based (the CT polls origin/master); backups are a
# daily in-container pg_dump plus the nightly Proxmox vzdump of the whole CT.
# The only job that belongs here is the one that benefits from being OFF the
# production network: an independent dead-man check of the public feeds.

on:
  schedule:
    - cron: "37 */6 * * *"  # Every 6h: off-site feed watchdog
  workflow_dispatch:

jobs:
  # Off-site dead-man: checks the public BlueSky feeds from the GitHub runner,
  # so it still fires when the homelab (power/network/host) is down — the
  # failure mode no Rakali-side monitor can report. Looser thresholds than the
  # CT-side watchdog (which has state and a cooldown) to stay quiet unless
  # output is seriously wrong.
  feed-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run feed watchdog (stdlib only, no infra access needed)
        id: watchdog
        continue-on-error: true
        run: |
          python3 scripts/monitoring/feed_watchdog.py --stale-hours 36 --coverage-floor 0.10 | tee watchdog_output.txt

      - name: Alert on watchdog failure
        if: steps.watchdog.outcome == 'failure'
        run: |
          BODY=$(tail -20 watchdog_output.txt | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}')
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"🚨 Off-site feed watchdog: output looks wrong\", \"description\": \"Independent check from GitHub runner (fires even if the homelab is down):\n\`\`\`\n${BODY}\n\`\`\`\", \"color\": 15158332, \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}], \"username\": \"CI/CD Bot\"}" \
            "${{ secrets.DISCORD_WEBHOOK_ALERTS }}" || echo "Failed to send Discord alert"

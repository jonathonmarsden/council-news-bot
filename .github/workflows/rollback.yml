name: Rollback

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to rollback to (leave empty for previous commit)'
        required: false
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10  # Get last 10 commits for context

      - name: Determine rollback target
        id: target
        run: |
          if [ -n "${{ github.event.inputs.commit }}" ]; then
            TARGET="${{ github.event.inputs.commit }}"
          else
            # Get the commit before current HEAD
            TARGET=$(git rev-parse HEAD~1)
          fi
          echo "commit=$TARGET" >> $GITHUB_OUTPUT
          echo "Rolling back to: $TARGET"
          git log --oneline -1 $TARGET

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Checkout target commit
        run: |
          git checkout ${{ steps.target.outputs.commit }}

      - name: Sync rollback code to VPS
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'venv' \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.DS_Store' \
            --exclude 'data' \
            --exclude '*.db' \
            --exclude 'scripts/deployment/deploy_secrets.py' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/council-news-bot"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/council-news-bot && docker compose down && docker compose up -d --build"
          echo "Rolled back to commit ${{ steps.target.outputs.commit }} at $(date)"

      - name: Verify rollback
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/council-news-bot && docker compose ps"

      - name: Send Discord alert
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993
            EMOJI="✅"
            TITLE="Rollback Successful"
            DESC="Rolled back to commit \`${{ steps.target.outputs.commit }}\`"
          else
            COLOR=15158332
            EMOJI="❌"
            TITLE="Rollback Failed"
            DESC="Failed to rollback to commit \`${{ steps.target.outputs.commit }}\`"
          fi
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"$EMOJI $TITLE\", \"description\": \"$DESC\", \"color\": $COLOR, \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}], \"username\": \"CI/CD Bot\"}" \
            "${{ secrets.DISCORD_WEBHOOK_ALERTS }}" || echo "Failed to send Discord alert"

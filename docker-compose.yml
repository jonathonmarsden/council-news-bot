services:
  bot:
    build: .
    container_name: council_news_bot
    restart: unless-stopped
    # Pass environment variables from .env file
    env_file:
      - .env
    # Persist the database and logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Set timezone to match target audience
    environment:
      - TZ=Australia/Sydney
      - DB_PATH=/app/data/bot.db
    # Resource limits (Prevent OOM freezes on 4GB VPS)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 128M
    # Log Rotation (Prevent Disk Full)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

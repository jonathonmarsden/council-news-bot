# Logrotate config for council-news-bot host-side cron logs.
# Installed to /etc/logrotate.d/council-news-bot by the deploy workflow.
# Docker's json-file rotation only covers container stdout; these files are
# appended by 48+ cron jobs/day and would otherwise fill the disk.
/var/log/council_bot_scraper.log /var/log/council_bot_cron.log /var/log/council_quiet_check.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
